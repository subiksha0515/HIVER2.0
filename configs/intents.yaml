metadata:
  total_intents: 11
  version: '1.0'
intents:
  SOFTWARE_UPDATE_ISSUES:
    name: SOFTWARE_UPDATE_ISSUES
    description: Inquiries regarding software updates, OS upgrade bugs, installation
      failures, or issues occurring immediately after updating.
    inclusion_criteria: Mentions software updates, OS version, update installation,
      or issues starting right after an update.
    exclusion_criteria: Hardware physical damage, simple app store billing issues,
      or shipping queries.
    sample_count: 1326
    representative_examples:
    - '@115850 Why can''t the updates move properly https://t.co/DMwBAxwJUV'
    - '@117634 I love my new Kindle Oasis! Please tell me that immersion reading will
      be added in a future update?!'
    - '@AmazonHelp How do I disable notifications indicated by the bell icon in upper
      left corner of iOS Kindle app?'
    - Hey @115850 @AmazonHelp I need an update on my refund! Can you help?
    - 'Hey @115821 wth does this mean? How can the iOS app on the phone be offline?
      #AmazonEcho https://t.co/bsAmAY4b38'
  BATTERY_POWER_CHARGING:
    name: BATTERY_POWER_CHARGING
    description: Issues related to battery life, rapid battery draining, device turning
      off, or failing to charge.
    inclusion_criteria: Contains terms like battery, charging, power, battery drain,
      charger, cable.
    exclusion_criteria: General software app crashes unless battery is explicitly
      cited.
    sample_count: 732
    representative_examples:
    - '@AmazonHelp where can I chat with a support member for a false charge'
    - "Haha @117634 has been sneakily charging me $9.99 SINCE FEBRUARY for a service\\
      \\ I never use\\U0001F4A9\\U0001F648\\U0001F44E $90 gone!!! Thanks @AmazonHelp"
    - '@AmazonHelp when do you guys charge for the Xbox one X I preordered? It ships
      the 6th.'
    - '@115850 : what type of product are you selling, we could have died.product
      was in use and then a blast Order no - 407-2808023-6902735 https://t.co/a8t07gJDuh'
    - Amazon is starting to piss me off. All of the sudden it wants to charge me money
      to return shit. No thank you. @115821
  ACCOUNT_LOGIN_SECURITY:
    name: ACCOUNT_LOGIN_SECURITY
    description: Questions regarding account access, locked accounts, password reset,
      2FA, or login authentication.
    inclusion_criteria: Mentions login, password, locked account, credentials, or
      account verification.
    exclusion_criteria: Billing disputes without account access issues.
    sample_count: 2903
    representative_examples:
    - '@115823 I want my amazon payments account CLOSED. dm me please.'
    - "Bought an @115821 Echo Show and it won\\u2019t recognize a single @AmazonHelp\\
      \\ account in our household. WTF, guys?"
    - '@AmazonHelp if I add another adult to my Amazon household (with their own account)
      can they see my wishlists/photos/order history?'
    - '@AmazonHelp i reset my password 3 times and it still says incorrect you gotta
      be shitting me'
    - "@AmazonHelp um, my account was locked as soon as I tried to login on desktop.\\
      \\ I still haven\\u2019t received an email on how to get it unlocked..."
  APP_CRASH_PERFORMANCE:
    name: APP_CRASH_PERFORMANCE
    description: Reports of application crashes, system lag, frozen screen, or apps
      failing to launch.
    inclusion_criteria: Mentions app freezing, crashing, unresponsive UI, or slow
      performance.
    exclusion_criteria: Physical screen damage or internet network connectivity issues.
    sample_count: 3176
    representative_examples:
    - '@115821 please spend time &amp; money to fix your app. Constant issues with
      it.'
    - "My Kindle not working properly is breaking my heart! \\U0001F629\\U0001F494"
    - '@AmazonHelp Trying to get a friend''s playlist on my Amazon music app but it
      keeps giving me the following message https://t.co/o6zINm6HBC'
    - '@117093 Hey yall. Why is my checkout not working? I click "checkout with fresh"
      and it takes me to an error page. What''s the deal?'
    - 'Seriously @115821 what is up with ordering things and it being open? You guys
      shipping returned items. 2nd day in a row this happens :SMH: https://t.co/gMyT1z9Zu1'
  BILLING_REFUND_SUBSCRIPTION:
    name: BILLING_REFUND_SUBSCRIPTION
    description: Billing inquiries, unauthorized charges, refund requests, payment
      processing issues, or subscription cancellations.
    inclusion_criteria: Contains billing terms, payment, charge, refund, money, receipt,
      or subscription.
    exclusion_criteria: Physical store hardware returns.
    sample_count: 6370
    representative_examples:
    - '@AmazonHelp I called customer service and was told my membership wouldn''t
      be renewed. I was just charged today. How do I get a refund? https://t.co/SeoQUsA0VA'
    - "@115821 being charged for amazon prime &amp; when I go to cancel it, it\\u2019\\
      s saying I\\u2019m not a member\\U0001F620\\U0001F620\\U0001F620"
    - '@115830 amazonuk took money without any https://t.co/w25zXi7DYp they are not
      giving it back nor giving clear statement of my refund proces'
    - "@115830 you pay for prime expecting next day delivery. Then receive 2 emails\\
      \\ half hr apart 'failed delivery' but your sitting at home \\U0001F621"
    - '@115821 why do I pay for 2 day shipping and it''s going on 4 days.'
  ORDER_SHIPPING_DELIVERY:
    name: ORDER_SHIPPING_DELIVERY
