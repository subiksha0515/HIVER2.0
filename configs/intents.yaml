      representative can''t even put me touch with manager.'
    - 'Anyone know how you mirror on the new Amazon Fire TV? @116439 want to screen
      mirror #amazonfiretv #fireTV'
    - "Si je dois faire un achat pour le Black Friday, \\xE7a sera la montre Samsung\\
      \\ Gear S3. Je compte sur vous @120533"
  STORE_REPAIR_SERVICE:
    name: STORE_REPAIR_SERVICE
    description: Requests for retail store appointments, hardware repair status, warranty
