      data, or pairing.
    exclusion_criteria: Power/battery issues.
    sample_count: 353
    representative_examples:
    - 'I lost my signal while searching something in @115821 and since the page didn''t
      load, this shows up...I am not even mad. #DogsForLife https://t.co/QhdOmksrrY'
    - '@115850 : can we connect echo dot to videocon smart tv? If yes, how?'
