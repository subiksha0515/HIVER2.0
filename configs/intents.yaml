    - "@117795 Now that I\\u2019m streaming to your Prime Do U have audio assisted\\
      \\ movies, TV, etc. as I am visually impaired. ?"
    - "@115830 I don\\u2019t think I ordered this with my headphone jack.. \\U0001F922\\
      \\U0001F922 https://t.co/aJbEVjQO3y"
    - "@5503 I\\u2019m enjoying the @128020 Experience on the @115833 dot. However,\\
      \\ I\\u2019d prefer to stream it through @118117 speaker. Alexa can\\u2019t manage\\
      \\ that, despite repeated attempts. During the most recent attempt, Alexa thought\\
      \\ I wanted, um, this: https://t.co/VsWvhMHake"
    - '@AmazonHelp just received the munchkin nursery projector and sound system and
      the volume does not work.'
  DISPLAY_SCREEN_PHYSICAL:
