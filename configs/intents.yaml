    - '@AmazonHelp why is Videos option missing in the skills for Alexa in India?
      Not able to connect my fire TV.'
    - Tem coisa melhor do q receber encomenda no teu nome e ainda antes da data prevista??
      @117086 te amo, namoral https://t.co/ydD9ZNF0U4
  AUDIO_SPEAKER_MICROPHONE:
    name: AUDIO_SPEAKER_MICROPHONE
