    - "@115821 @AmazonHelp why is my order at my local courier for the last 6 days\\
      \\ and still hasn\\u2019t been delivered to me?? Over 1 week late \\U0001F621"
    - .@AmazonHelp Item has not been delivered but tracking says it was handed to
      me over an hour ago... 2nd time this has happened. Sort it out https://t.co/42W82GcARk
    - "@AmazonHelp delivery I paid for today,didn\\u2019t arrive.why not?i paid enough\\
      \\ for it.where is it??I\\u2019m unhappy.refund the delivery charge"
    - Anna Inspired in idea lab at school to be @115821 package being shipped to Narnia!
      "Amazon can go anywhere" according to Anna. https://t.co/TyvKhuu7su
  CONNECTIVITY_NETWORK_WIFI:
    name: CONNECTIVITY_NETWORK_WIFI
    description: Issues connecting to Wi-Fi, Bluetooth devices, cellular network data,
      or SIM card errors.
